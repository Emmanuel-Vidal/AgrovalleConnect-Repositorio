# Server Port
server.port=8080

# Spring Datasource Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/agrovalle_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Moreno

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application Specific Settings
app.name=AgroValle Connect API
app.version=1.0.0